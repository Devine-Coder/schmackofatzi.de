<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-label="Dönerspieß">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset=".65" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#e23a1f"/>
    </linearGradient>
    <clipPath id="cone">
      <path d="M112 92 Q180 70 248 92 L222 330 Q180 345 138 330 Z"/>
    </clipPath>
    <!-- Streifenmuster, das seitlich wandert: sieht aus, als würde sich der Spieß drehen -->
    <pattern id="meat" width="40" height="440" patternUnits="userSpaceOnUse">
      <rect width="40" height="440" fill="#9a5528"/>
      <rect x="0" width="9" height="440" fill="#7a3f1c"/>
      <rect x="18" width="6" height="440" fill="#b86b35"/>
      <rect x="30" width="4" height="440" fill="#6b3416"/>
    </pattern>
    <style>
      .dreh { animation: dreh 3.2s linear infinite; }
      @keyframes dreh { from { transform: translateX(0); } to { transform: translateX(40px); } }
      .gluehen { animation: gluehen 1.6s ease-in-out infinite alternate; }
      @keyframes gluehen { from { opacity: .75; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .dreh, .gluehen { animation: none; } }
    </style>
  </defs>

  <circle cx="180" cy="200" r="175" fill="url(#glow)"/>

  <!-- Spieß -->
  <rect x="176" y="30" width="8" height="340" rx="4" fill="#9aa3ab"/>
  <circle cx="180" cy="30" r="9" fill="#7b848c"/>

  <!-- Fleischkegel -->
  <g clip-path="url(#cone)">
    <rect class="dreh" x="60" y="60" width="260" height="300" fill="url(#meat)"/>
    <!-- Schichtlinien -->
    <g stroke="#5a2c10" stroke-opacity=".35" stroke-width="3">
      <path d="M100 120 Q180 132 260 120"/>
      <path d="M100 160 Q180 172 260 160"/>
      <path d="M100 200 Q180 212 260 200"/>
      <path d="M100 240 Q180 252 260 240"/>
      <path d="M100 280 Q180 292 260 280"/>
    </g>
    <rect x="60" y="60" width="260" height="300" fill="url(#shade)"/>
  </g>
  <path d="M112 92 Q180 70 248 92 L222 330 Q180 345 138 330 Z" fill="none" stroke="#5a2c10" stroke-width="3"/>

  <!-- Tomate + Zwiebel oben -->
  <ellipse cx="180" cy="84" rx="44" ry="12" fill="#e3432d"/>
  <ellipse cx="180" cy="80" rx="30" ry="8" fill="#f4f0e6" stroke="#d9cfbd" stroke-width="2"/>

  <!-- Teller unten -->
  <ellipse cx="180" cy="352" rx="80" ry="16" fill="#c9ced3"/>
  <rect x="150" y="352" width="60" height="44" fill="#aab1b8"/>
  <ellipse cx="180" cy="400" rx="96" ry="18" fill="#8d959c"/>

  <!-- Grill-Heizstäbe rechts -->
  <g class="gluehen">
    <rect x="276" y="100" width="22" height="220" rx="8" fill="#3b3b3b"/>
    <rect x="281" y="112" width="12" height="36" rx="5" fill="url(#heat)"/>
    <rect x="281" y="160" width="12" height="36" rx="5" fill="url(#heat)"/>
    <rect x="281" y="208" width="12" height="36" rx="5" fill="url(#heat)"/>
    <rect x="281" y="256" width="12" height="36" rx="5" fill="url(#heat)"/>
  </g>

  <!-- Fähnchen -->
  <g transform="translate(28 38) rotate(-8)">
    <rect x="0" y="0" width="140" height="38" rx="8" fill="#ffd84d" stroke="#2a1a12" stroke-width="2.5"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="15" fill="#2a1a12">Schmackofatz!</text>
  </g>
</svg>
